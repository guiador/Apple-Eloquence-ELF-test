name: APK ARM64 de pruebas
on:
  push:
    branches: [codex/android-pruebas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Herramientas nativas
        run: |
          python -m pip install lief
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - name: Convertir motor del padre para ARM64
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          bash android/stage-libs.sh 24
      - name: Compilar APK y comprobar manifiesto
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Verificar firma y arquitectura
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > apk-info.txt
          sha256sum "$APK" > SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Apple-Eloquence-1.3.0-ARM64-pruebas
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-info.txt
            SHA256.txt
            TEST-BUILD-NOTICES.md
            TEST-BUILD-LICENSE-FreeEloquence.txt
            sd_eloquence/LICENSE.GPL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-Android
          path: |
            android/app/build/reports/
            android/app/build/test-results/
